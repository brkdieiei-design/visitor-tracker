
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Tracker</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 20px;
}
main {
  max-width: 430px;
  width: 100%;
  background: #151515;
  border: 1px solid #8e1729;
  border-radius: 18px;
  padding: 25px;
}
h1 { color: #ff3048; }
p { color: #bbb; line-height: 1.6; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #b51c32;
  color: white;
  font-size: 16px;
}
#status { color: #64db9a; }
</style>
</head>
<body>
<main>
  <h1>VISITOR TRACKER</h1>
  <p>Willkommen auf unserer Website.</p>
  <p>
    Wir verwenden datenschutzfreundliche,
    aggregierte Besucherstatistiken.
    Bitte informiere dich über die
    Datenschutzbestimmungen.
  </p>
  <button id="accept">Statistik zustimmen</button>
  <button id="decline">Ablehnen</button>
  <p id="status" aria-live="polite"></p>
</main>
<script>
const status = document.getElementById("status");

document.getElementById("accept").onclick = () => {
  localStorage.setItem("analyticsConsent", "yes");
  status.textContent = "Zustimmung auf diesem Gerät gespeichert.";
};

document.getElementById("decline").onclick = () => {
  localStorage.setItem("analyticsConsent", "no");
  status.textContent = "Statistik abgelehnt.";
};
</script>
</body>
</html>
